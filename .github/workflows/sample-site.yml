name: Sample site

# Builds the public portfolio from the fictional examples/sample-bank/ (leak-guarded, with the
# PDF resume) and deploys it to this repo's GitHub Pages, as a live demo of the tool.
# Setup: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - "examples/sample-bank/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/sample-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned to commit SHAs; Dependabot (.github/dependabot.yml) bumps them.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked

      - name: Validate sample bank
        run: uv run rmgr validate --strict --root examples/sample-bank

      # Carlito is metric-compatible with Calibri, so pagination matches local builds.
      - name: Install LibreOffice (renders the PDF resume)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer fonts-crosextra-carlito

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site (fails on any private-data leak)
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: uv run rmgr build site --root examples/sample-bank --out build/site --base-url "${BASE_URL%/}/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
