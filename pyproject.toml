[project]
name = "resume-mgmt"
version = "0.3.1"
description = "Evidence-backed career bank: validate accomplishments, tailor ATS-safe resumes, publish a leak-guarded portfolio"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "typer>=0.12",
]

[project.scripts]
rmgr = "resume_mgmt.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_mgmt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
